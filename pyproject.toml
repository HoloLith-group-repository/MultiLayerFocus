[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stratified-focus"
version = "0.6.6"
description = "Vectorial Debye focusing in coherent isotropic planar multilayers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
gui = ["PyQt6>=6.5", "reportlab>=4.0", "vtk>=9.3", "pillow>=10"]

[project.scripts]
stratified-focus = "stratified_focus.gui:main"

[tool.setuptools.packages.find]
include = ["stratified_focus*"]

[tool.setuptools.package-data]
stratified_focus = ["colormaps.npz", "icon.png"]
